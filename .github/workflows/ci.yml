name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoplatform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit + e2e (SQLite + fake Redis)
        run: python -m pytest -q
      - name: Same suite on real Postgres + Redis
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoplatform_test
          TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q
      - name: Docker build
        run: docker build -t autoplatform:ci .
