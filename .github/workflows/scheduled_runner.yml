# Free uptime monitor for the deployed platform (the Cloudflare Worker runs its own
# every-minute cron for queue draining and maintenance, and never sleeps).
#
# Every 30 min: GET /healthz, retrying for ~2 min. If it isn't "ok", the run fails and
# GitHub emails the repo owner (free alerting). Optional fallback: when the host is down
# and RUN_DRAIN_FALLBACK=true, drain the queue inside Actions with the Python worker
# (needs secrets DATABASE_URL, UPSTASH_REDIS_URL, GROQ_API_KEY, GEMINI_API_KEY).
name: uptime-monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write   # only to reset GitHub's 60-day inactivity timer for this schedule
    env:
      PLATFORM_URL: ${{ vars.PLATFORM_URL || 'https://autoplatform.data-marketplace-edge.workers.dev' }}
    steps:
      - name: Check /healthz
        id: health
        continue-on-error: true
        run: |
          if [ -z "$PLATFORM_URL" ]; then echo "::notice::PLATFORM_URL not set yet - skipping."; exit 0; fi
          for i in $(seq 1 8); do
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 20 "$PLATFORM_URL/healthz" || echo 000)
            status=$(python3 -c "import json;print(json.load(open('health.json')).get('status',''))" 2>/dev/null || true)
            echo "attempt $i: HTTP $code status=$status"
            if [ "$code" = "200" ] && [ "$status" = "ok" ]; then cat health.json; echo; exit 0; fi
            sleep 15
          done
          cat health.json 2>/dev/null; echo
          echo "::error::$PLATFORM_URL is not healthy"
          exit 1

      - name: Keep this schedule enabled (GitHub disables idle schedules after 60 days)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "00" ] && [ $(( 10#$(date -u +%M) )) -lt 30 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scheduled_runner.yml/enable" && echo "schedule kept alive"
          fi

      - name: Set up Python (fallback drain)
        if: steps.health.outcome == 'failure' && vars.RUN_DRAIN_FALLBACK == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout (fallback drain)
        if: steps.health.outcome == 'failure' && vars.RUN_DRAIN_FALLBACK == 'true'
        uses: actions/checkout@v4

      - name: Drain queue inside Actions (host down)
        if: steps.health.outcome == 'failure' && vars.RUN_DRAIN_FALLBACK == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q -r requirements.txt
          python -m workers.worker --drain --max-seconds 240

      - name: Report
        if: steps.health.outcome == 'failure'
        run: exit 1
